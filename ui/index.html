<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Token Speed</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="monitor" class="monitor">
    <button id="compact-main" class="compact-main" type="button" aria-label="打开 Token Speed 设置" title="拖动移动 · 单击设置">
      <span id="display-slot" class="display-slot" aria-live="polite"></span>
    </button>
    <button id="settings-button" class="icon-button" type="button" aria-label="打开设置" title="设置">
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m8 3 .5-1h3L12 3l1.5.9 1.2.1 1.5 2.6-.6 1.1V10l.6 1.1-1.5 2.6-1.2.1-1.5.9-.5 1h-3l-.5-1-1.5-.9-1.2-.1-1.5-2.6.6-1.1V7.7L3.8 6.6l1.5-2.6 1.2-.1L8 3Z"/><circle cx="10" cy="8.8" r="2.5"/></svg>
    </button>
  </main>
  <main id="settings-panel" class="settings-panel" hidden>
    <header class="settings-header">
      <img class="app-symbol" src="./app-icon.png" alt="" />
      <h1>Token Speed</h1>
      <span id="save-status" class="save-status" aria-live="polite">已保存</span>
      <button id="close-settings" class="icon-button close-button" type="button" aria-label="关闭设置" title="关闭 · Esc"><svg viewBox="0 0 20 20"><path d="m6 6 8 8m0-8-8 8"/></svg></button>
    </header>
    <nav class="settings-tabs" aria-label="设置分类">
      <button id="display-tab" type="button" aria-pressed="true" class="active">显示</button>
      <button id="preferences-tab" type="button" aria-pressed="false">偏好</button>
    </nav>
    <div class="settings-content">
      <section id="display-page" class="settings-page" aria-label="显示设置">
        <div class="group-heading"><span>监控条</span><span id="monitor-width" class="muted">142 px</span></div>
        <div class="settings-group">
          <div class="setting-row"><label for="window-mode">显示位置</label><select id="window-mode"><option value="taskbar">任务栏</option><option value="floating">桌面悬浮条</option></select></div>
          <div class="setting-row"><label for="display-mode"><span class="app-pair" aria-hidden="true"><i></i><i></i></span>显示应用</label><select id="display-mode"><option value="both">Claude + Codex</option><option value="claude">仅 Claude</option><option value="codex">仅 Codex</option></select></div>
          <div class="setting-row"><label for="font-size">文字大小</label><div class="range-control"><input id="font-size" type="range" min="10" max="16" value="11" /><output id="font-size-value" for="font-size">11 px</output></div></div>
        </div>
        <div class="group-heading"><span>速度曲线</span><span class="muted">Y 轴自动缩放</span></div>
        <div class="settings-group">
          <div class="setting-row"><label for="show-chart">显示曲线</label><label class="toggle-control"><input id="show-chart" type="checkbox" checked /><span class="switch" aria-hidden="true"></span></label></div>
          <div class="setting-row"><label for="chart-width">曲线宽度</label><div class="range-control"><input id="chart-width" type="range" min="24" max="80" value="40" /><output id="chart-width-value" for="chart-width">40 px</output></div></div>
          <div class="setting-row"><label for="idle-after-seconds">完成速度保留</label><select id="idle-after-seconds"><option value="15">15 秒</option><option value="30">30 秒</option><option value="60">60 秒</option></select></div>
        </div>
        <div class="group-heading"><span>位置微调</span><span id="monitor-geometry" class="muted">屏幕 X —</span></div>
        <div class="settings-group taskbar-setting position-group">
          <div class="setting-row"><label for="taskbar-offset">水平偏移</label><div class="offset-control"><button type="button" data-nudge="-5" title="左移 5px">−5</button><button type="button" data-nudge="-1" title="左移 1px">−</button><div class="number-field"><input id="taskbar-offset" type="number" min="-5000" max="5000" step="1" value="0" /><span>px</span></div><button type="button" data-nudge="1" title="右移 1px">+</button><button type="button" data-nudge="5" title="右移 5px">+5</button></div></div>
        </div>
        <p class="page-note">负数向左，正数向右。也可直接拖动监控条。</p>
      </section>
      <section id="preferences-page" class="settings-page" aria-label="偏好设置" hidden>
        <div class="group-heading"><span>悬浮条外观</span><span id="floating-hint" class="muted">悬浮模式可用</span></div>
        <div class="settings-group">
          <div class="setting-row floating-setting"><label for="theme">主题</label><select id="theme"><option value="dark">深色</option><option value="light">浅色</option></select></div>
          <div class="setting-row floating-setting"><label for="opacity">背景不透明度</label><div class="range-control"><input id="opacity" type="range" min="30" max="100" value="92" /><output id="opacity-value" for="opacity">92%</output></div></div>
          <div class="setting-row floating-setting"><label for="always-on-top">始终置顶</label><label class="toggle-control"><input id="always-on-top" type="checkbox" checked /><span class="switch" aria-hidden="true"></span></label></div>
        </div>
        <div class="group-heading"><span>通用</span></div>
        <div class="settings-group">
          <div class="setting-row"><label for="position-locked">锁定监控位置</label><label class="toggle-control"><input id="position-locked" type="checkbox" /><span class="switch" aria-hidden="true"></span></label></div>
          <div class="setting-row"><label for="autostart-toggle">开机启动</label><label class="toggle-control"><input id="autostart-toggle" type="checkbox" /><span class="switch" aria-hidden="true"></span></label></div>
        </div>
        <div class="info-note"><span class="info-mark" aria-hidden="true">i</span><p>显示的是已完成请求的速度。保留时间结束后回到「待机」，悬停可查看上次结果。</p></div>
      </section>
    </div>
    <footer class="settings-footer">
      <div class="connection-row"><div id="database-status" class="database-status"><span class="status-dot"></span><span class="database-label">正在连接数据库</span></div><span>只读 CC Switch</span></div>
      <div class="footer-actions"><button id="reset-position" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 8a6 6 0 1 1 0 5M4 3v5h5"/></svg>复位位置</button><button id="quit-button" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2v8M5 5a7 7 0 1 0 10 0"/></svg>退出</button></div>
    </footer>
    <div id="feedback" class="feedback" role="status" hidden></div>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
